<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060c">
<title>The Ghost Train — Hollow Manor Level 7</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;background:#05060c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:Georgia,serif;color:#efe8ff;text-align:center"><small style="font:800 12px system-ui,sans-serif;letter-spacing:3px;color:#9b6bff">LOADING</small><b style="font-size:32px;text-shadow:0 0 18px #9b6bff"></b></div>
<script>{ const t = document.title.split(' — '), m = /Level (\d+)/.exec(document.title); document.querySelector('#boot b').textContent = t[0]; document.querySelector('#boot small').textContent = 'LEVEL ' + (m ? m[1] : 1); }</script>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
// version.json changes with every update and is always fetched fresh, so new engine/room code loads straight away
const v = await fetch('../version.json', { cache: 'no-store' }).then(r => r.json()).then(j => j.v).catch(() => Date.now());
const [{ run }, { default: level }] = await Promise.all([import('../engine.js?v=' + v), import('./rooms.js?v=' + v)]);
run(THREE, level);
</script>
</body>
</html>
