<title>The Wax Museum — Hollow Manor Level 16</title>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
// version.json changes with every update and is always fetched fresh, so new engine/room code loads straight away
const v = await fetch('../version.json', { cache: 'no-store' }).then(r => r.json()).then(j => j.v).catch(() => Date.now());
const [{ run }, { default: level }] = await Promise.all([import('../engine.js?v=' + v), import('./rooms.js?v=' + v)]);
run(THREE, level);
</script>
</body>
